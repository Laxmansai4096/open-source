name: OmniSynapse-Titan Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Phase 1 Ingestion, Merkle DAG & ERP Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest duckdb networkx

      - name: Run Pytest Suite
        env:
          RUN_MODE: local
        run: |
          python -m pytest -v

      - name: Run Standalone Verification Runner
        env:
          RUN_MODE: local
        run: |
          python run_tests.py

  build-and-deploy-container:
    name: Build Docker Container & Deploy to Azure Container Apps
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: acrexploreai65064.azurecr.io
          username: acrexploreai65064
          password: ${{ secrets.AZURE_ACR_PASSWORD || '6UM6kvdpN6Xtbv3rZsT8c3GyvLLlNIqxtWNUFBZFRaI298Hb56PpJQQJ99CIACYeBjFEqg7NAAACAZCRe2kT' }}

      - name: Build and Push Docker Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            acrexploreai65064.azurecr.io/omnisynapse-titan:latest
            acrexploreai65064.azurecr.io/omnisynapse-titan:${{ github.sha }}
